name: Deploy staging

on:
  workflow_dispatch:
    inputs:
      desired_count:
        description: Running web tasks after a successful migration
        required: true
        default: "1"
        type: choice
        options: ["1", "2"]
      app_mode:
        description: Generation mode for the deployed service
        required: true
        default: replay
        type: choice
        options: ["replay", "live"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: imkan-staging-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ENVIRONMENT_NAME: imkan-staging
  FOUNDATION_STACK: imkan-staging-foundation
  EDGE_STACK: imkan-staging-edge
  SERVICE_STACK: imkan-staging-service
  CFN_ROLE_ARN: ${{ vars.AWS_CLOUDFORMATION_ROLE_ARN }}
  AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
  OIDC_SUBJECT: ${{ vars.OIDC_SUBJECT }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: staging
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check

      - name: Validate deployment configuration
        run: ./scripts/check-production-config.sh

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: imkan-${{ github.run_id }}

      - name: Keep deployment roles current
        run: |
          test -n "$OIDC_SUBJECT"
          aws cloudformation deploy \
            --stack-name "$ENVIRONMENT_NAME-oidc" \
            --template-file infra/aws/github-oidc-role.json \
            --role-arn "$CFN_ROLE_ARN" \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              EnvironmentName="$ENVIRONMENT_NAME" \
              GitHubSubject="$OIDC_SUBJECT"

      - name: Remove a previously rolled-back foundation
        run: |
          STATUS=$(aws cloudformation describe-stacks --stack-name "$FOUNDATION_STACK" \
            --query 'Stacks[0].StackStatus' --output text 2>/dev/null || true)
          if [ "$STATUS" = "ROLLBACK_COMPLETE" ]; then
            aws cloudformation delete-stack --stack-name "$FOUNDATION_STACK"
            aws cloudformation wait stack-delete-complete --stack-name "$FOUNDATION_STACK"
          fi

      - name: Resolve the CloudFront origin prefix list
        id: cloudfront_ranges
        run: |
          PREFIX_LIST_ID=$(aws ec2 describe-managed-prefix-lists \
            --filters Name=prefix-list-name,Values=com.amazonaws.global.cloudfront.origin-facing \
            --query 'PrefixLists[0].PrefixListId' --output text)
          test -n "$PREFIX_LIST_ID"
          test "$PREFIX_LIST_ID" != "None"
          echo "prefix_list_id=$PREFIX_LIST_ID" >> "$GITHUB_OUTPUT"

      - name: Deploy or update the foundation
        env:
          CLOUDFRONT_PREFIX_LIST_ID: ${{ steps.cloudfront_ranges.outputs.prefix_list_id }}
        run: |
          aws cloudformation deploy \
            --stack-name "$FOUNDATION_STACK" \
            --template-file infra/aws/foundation.json \
            --role-arn "$CFN_ROLE_ARN" \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              EnvironmentName="$ENVIRONMENT_NAME" \
              CertificateArn="" \
              CloudFrontPrefixListId="$CLOUDFRONT_PREFIX_LIST_ID" \
              DatabaseDeletionProtection=false \
              DatabaseMultiAz=false

      - name: Report foundation failure details
        if: failure()
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$FOUNDATION_STACK" \
            --query 'Stacks[0].{Status:StackStatus,Reason:StackStatusReason}' || true
          aws cloudformation describe-stack-events \
            --stack-name "$FOUNDATION_STACK" \
            --query 'StackEvents[?ResourceStatus==`CREATE_FAILED` || ResourceStatus==`ROLLBACK_FAILED`].[Timestamp,LogicalResourceId,ResourceType,ResourceStatusReason]' \
            --output table || true

      - name: Read foundation outputs
        id: foundation
        run: |
          output() {
            aws cloudformation describe-stacks --stack-name "$FOUNDATION_STACK" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue | [0]" --output text
          }
          echo "web_repository=$(output WebRepositoryUri)" >> "$GITHUB_OUTPUT"
          echo "migration_repository=$(output MigrationRepositoryUri)" >> "$GITHUB_OUTPUT"
          echo "cluster=$(output ClusterName)" >> "$GITHUB_OUTPUT"
          echo "subnet_a=$(output PublicSubnetAId)" >> "$GITHUB_OUTPUT"
          echo "subnet_b=$(output PublicSubnetBId)" >> "$GITHUB_OUTPUT"
          echo "task_security_group=$(output EcsSecurityGroupId)" >> "$GITHUB_OUTPUT"
          echo "alb_dns=$(output AlbDnsName)" >> "$GITHUB_OUTPUT"

      - name: Deploy the free-tier HTTPS edge
        run: |
          aws cloudformation deploy \
            --stack-name "$EDGE_STACK" \
            --template-file infra/aws/edge.json \
            --role-arn "$CFN_ROLE_ARN" \
            --no-fail-on-empty-changeset \
            --parameter-overrides EnvironmentName="$ENVIRONMENT_NAME"

      - name: Read HTTPS edge URL
        id: edge
        run: |
          HTTPS_URL=$(aws cloudformation describe-stacks --stack-name "$EDGE_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='HttpsUrl'].OutputValue | [0]" --output text)
          test -n "$HTTPS_URL"
          test "$HTTPS_URL" != "None"
          echo "https_url=$HTTPS_URL" >> "$GITHUB_OUTPUT"
          echo "### HTTPS demo" >> "$GITHUB_STEP_SUMMARY"
          echo "$HTTPS_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push immutable images
        env:
          WEB_REPOSITORY: ${{ steps.foundation.outputs.web_repository }}
          MIGRATION_REPOSITORY: ${{ steps.foundation.outputs.migration_repository }}
        run: |
          WEB_TAG="web-$GITHUB_SHA"
          MIGRATION_TAG="migration-$GITHUB_SHA"
          docker build --target runner -t "$WEB_REPOSITORY:$WEB_TAG" .
          docker build --target migration -t "$MIGRATION_REPOSITORY:$MIGRATION_TAG" .
          if ! aws ecr describe-images --repository-name "$ENVIRONMENT_NAME-web" \
            --image-ids imageTag="$WEB_TAG" >/dev/null 2>&1; then
            docker push "$WEB_REPOSITORY:$WEB_TAG"
          fi
          if ! aws ecr describe-images --repository-name "$ENVIRONMENT_NAME-migration" \
            --image-ids imageTag="$MIGRATION_TAG" >/dev/null 2>&1; then
            docker push "$MIGRATION_REPOSITORY:$MIGRATION_TAG"
          fi

      - name: Store the generation provider key
        id: provider_secret
        env:
          PROVIDER_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$PROVIDER_API_KEY" ]; then
            echo "No provider key configured; the service stays in replay mode."
            echo "arn=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SECRET_NAME="$ENVIRONMENT_NAME/generation-provider"
          SECRET_JSON=$(jq -cn --arg apiKey "$PROVIDER_API_KEY" '{apiKey:$apiKey}')
          if ARN=$(aws secretsmanager describe-secret --secret-id "$SECRET_NAME" \
            --query ARN --output text 2>/dev/null); then
            aws secretsmanager put-secret-value \
              --secret-id "$SECRET_NAME" \
              --secret-string "$SECRET_JSON" >/dev/null
          else
            ARN=$(aws secretsmanager create-secret \
              --name "$SECRET_NAME" \
              --description "IMKAN staging generation provider key" \
              --secret-string "$SECRET_JSON" \
              --query ARN --output text)
          fi
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"

      - name: Register the migration release without changing web traffic
        env:
          CLUSTER: ${{ steps.foundation.outputs.cluster }}
          DESIRED_COUNT: ${{ inputs.desired_count }}
          APP_MODE: ${{ inputs.app_mode }}
          PROVIDER_SECRET_ARN: ${{ steps.provider_secret.outputs.arn }}
        run: |
          WEB_TAG="web-$GITHUB_SHA"
          MIGRATION_TAG="migration-$GITHUB_SHA"
          if aws cloudformation describe-stacks --stack-name "$SERVICE_STACK" >/dev/null 2>&1; then
            CURRENT_WEB_TAG=$(aws cloudformation describe-stacks --stack-name "$SERVICE_STACK" \
              --query "Stacks[0].Parameters[?ParameterKey=='WebImageTag'].ParameterValue | [0]" --output text)
            CURRENT_DESIRED=$(aws ecs describe-services \
              --cluster "$CLUSTER" --services "$ENVIRONMENT_NAME-web" \
              --query 'services[0].desiredCount' --output text)
          else
            CURRENT_WEB_TAG="$WEB_TAG"
            CURRENT_DESIRED=0
          fi
          if [ "$CURRENT_DESIRED" = "0" ]; then
            # With no live traffic, stage the new web image before migration so
            # ECS never uses an obsolete image as the first rollback baseline.
            CURRENT_WEB_TAG="$WEB_TAG"
          fi
          aws cloudformation deploy \
            --stack-name "$SERVICE_STACK" \
            --template-file infra/aws/service.json \
            --role-arn "$CFN_ROLE_ARN" \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              EnvironmentName="$ENVIRONMENT_NAME" \
              WebImageTag="$CURRENT_WEB_TAG" \
              MigrationImageTag="$MIGRATION_TAG" \
              DesiredCount="$CURRENT_DESIRED" \
              AppMode="$APP_MODE" \
              ProviderSecretArn="$PROVIDER_SECRET_ARN"

      - name: Run database migrations
        env:
          CLUSTER: ${{ steps.foundation.outputs.cluster }}
          SUBNET_A: ${{ steps.foundation.outputs.subnet_a }}
          SUBNET_B: ${{ steps.foundation.outputs.subnet_b }}
          TASK_SECURITY_GROUP: ${{ steps.foundation.outputs.task_security_group }}
        run: |
          TASK_DEFINITION=$(aws cloudformation describe-stacks --stack-name "$SERVICE_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='MigrationTaskDefinitionArn'].OutputValue | [0]" --output text)
          TASK_ARN=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$TASK_DEFINITION" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNET_A,$SUBNET_B],securityGroups=[$TASK_SECURITY_GROUP],assignPublicIp=ENABLED}" \
            --started-by "github-$GITHUB_RUN_ID" \
            --query 'tasks[0].taskArn' --output text)
          test "$TASK_ARN" != "None"
          if ! timeout 15m aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"; then
            aws ecs stop-task --cluster "$CLUSTER" --task "$TASK_ARN" \
              --reason "Migration exceeded the 15 minute deployment limit"
            exit 1
          fi
          EXIT_CODE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[?name==`migration`].exitCode | [0]' --output text)
          if [ "$EXIT_CODE" != "0" ]; then
            aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
              --query 'tasks[0].{stopCode:stopCode,reason:stoppedReason,containers:containers[].{name:name,reason:reason,exitCode:exitCode}}'
            LOG_STREAM=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
              --query 'tasks[0].containers[?name==`migration`].logStreamName | [0]' --output text)
            if [ -z "$LOG_STREAM" ] || [ "$LOG_STREAM" = "None" ]; then
              TASK_ID=${TASK_ARN##*/}
              LOG_STREAM="migration/migration/$TASK_ID"
            fi
            aws logs get-log-events \
              --log-group-name "/ecs/$ENVIRONMENT_NAME/migration" \
              --log-stream-name "$LOG_STREAM" \
              --query 'events[].message' --output text || true
            exit 1
          fi

      - name: Deploy the web image after migrations succeed
        env:
          DESIRED_COUNT: ${{ inputs.desired_count }}
          APP_MODE: ${{ inputs.app_mode }}
          PROVIDER_SECRET_ARN: ${{ steps.provider_secret.outputs.arn }}
        run: |
          aws cloudformation deploy \
            --stack-name "$SERVICE_STACK" \
            --template-file infra/aws/service.json \
            --role-arn "$CFN_ROLE_ARN" \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              EnvironmentName="$ENVIRONMENT_NAME" \
              WebImageTag="web-$GITHUB_SHA" \
              MigrationImageTag="migration-$GITHUB_SHA" \
              DesiredCount="$DESIRED_COUNT" \
              AppMode="$APP_MODE" \
              ProviderSecretArn="$PROVIDER_SECRET_ARN"

      - name: Smoke the deployed health endpoint
        env:
          HTTPS_URL: ${{ steps.edge.outputs.https_url }}
        run: |
          curl --fail --show-error --silent --retry 12 --retry-delay 5 \
            "$HTTPS_URL/api/health"
