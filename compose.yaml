services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: imkan
      POSTGRES_PASSWORD: imkan-local-only
      POSTGRES_DB: imkan
    ports:
      - "54329:5432"
    volumes:
      - imkan-postgres:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imkan -d imkan"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  imkan-postgres:
